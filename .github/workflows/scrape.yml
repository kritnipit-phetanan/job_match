# ============================================================
# JobMatcher — Automated Scraping & ETL Pipeline
# รัน scraper + ETL ทุกคืน แล้ว upsert เข้า Supabase
# ============================================================
name: Nightly Scrape & ETL

on:
  # รันอัตโนมัติทุกวันเริ่มต้นที่ 01:45 UTC (08:45 เวลาไทย)
  # (จากนั้นจะมีการใช้ sleep เพื่อสุ่มดีเลย์ไปถึง 14:30)
  schedule:
    - cron: '45 1 * * *'

  # รัน manual ได้จาก GitHub UI
  workflow_dispatch:

jobs:
  scrape-and-etl:
    runs-on: self-hosted
    timeout-minutes: 90

    steps:
      # ---------------------------------------------------------
      # 1. Checkout code
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Setup Python — ใช้ Python 3.11 ที่ติดตั้งอยู่บนเครื่องอยู่แล้ว
      #    (ไม่ใช้ actions/setup-python เพราะ self-hosted runner ไม่มี
      #    tool cache ต้องดาวน์โหลดทุกครั้ง ทำให้พังง่ายเวลาเน็ตกระตุก)
      # ---------------------------------------------------------
      - name: Add Python 3.11 to PATH
        run: echo "/Library/Frameworks/Python.framework/Versions/3.11/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      # ---------------------------------------------------------
      # 3. Install Playwright (Chromium only)
      # ---------------------------------------------------------
      - name: Install Playwright browsers
        run: playwright install chromium

      # ---------------------------------------------------------
      # 4. Phase 1 — Scrape job listings → upsert เข้า DB
      #    Retry สูงสุด 2 ครั้ง
      # ---------------------------------------------------------
      - name: "Phase 1: Scrape job listings"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JOBSDB_COOKIES: ${{ secrets.JOBSDB_COOKIES }}
          HEADLESS: "true"
        run: |
          for attempt in 1 2; do
            echo "=== Phase 1: Attempt $attempt ==="
            if python3 cloud_scrape_jobs.py; then
              echo "✅ Phase 1 succeeded on attempt $attempt"
              break
            else
              echo "❌ Phase 1 failed on attempt $attempt"
              if [ $attempt -lt 2 ]; then
                echo "⏳ Waiting 60s before retry..."
                sleep 60
              else
                echo "🔥 Phase 1 failed after 2 attempts — failing this step"
                exit 1
              fi
            fi
          done

      # ---------------------------------------------------------
      # 4.5. Upload debug screenshot (ถ้ามี)
      # ---------------------------------------------------------
      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: "*.png"
          if-no-files-found: ignore
          retention-days: 7

      # ---------------------------------------------------------
      # 5. Phase 2 — Scrape JD details → update description
      # ---------------------------------------------------------
      - name: "Phase 2: Scrape job descriptions"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JOBSDB_COOKIES: ${{ secrets.JOBSDB_COOKIES }}
          HEADLESS: "true"
        run: python3 cloud_scrape_details.py

      # ---------------------------------------------------------
      # 6. ETL — Extract skills + Embed → upsert เข้า DB
      # ---------------------------------------------------------
      - name: "ETL: Extract skills & embeddings"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 -m etl.load_to_db

      # ---------------------------------------------------------
      # 7. Repair — รีเซ็ตงานที่มีปัญหา (skills=[], JD='Not Found')
      #    เพื่อให้รอบถัดไปทำใหม่อัตโนมัติ
      # ---------------------------------------------------------
      - name: "Repair: Reset broken jobs"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 repair_jobs.py fix

      # ---------------------------------------------------------
      # 8. Deactivate — ปิดงานที่ไม่ได้อัปเดตเกิน 30 วัน
      #    ไม่ลบข้อมูล แค่ set is_active = false
      # ---------------------------------------------------------
      - name: "Deactivate stale jobs (30+ days)"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 deactivate_stale_jobs.py
